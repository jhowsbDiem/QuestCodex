# ==========================================================
# CONFIGURAÇÃO DE TAGS, SCOREBOARD, COLISEU E PARTIDA
# ==========================================================
# Cores disponíveis:
# RED (Vermelho), DARK_RED (Vermelho Escuro), GOLD (Laranja/Ouro),
# YELLOW (Amarelo), GREEN (Verde Claro), DARK_GREEN (Verde Escuro),
# AQUA (Azul Claro/Ciano), DARK_AQUA (Ciano Escuro), BLUE (Azul),
# DARK_BLUE (Azul Escuro), LIGHT_PURPLE (Rosa/Roxo Claro),
# DARK_PURPLE (Roxo), WHITE (Branco), GRAY (Cinza), DARK_GRAY (Cinza Escuro)
# ==========================================================

scoreboard:
  ativada: true
  titulo: "QUEST CODEX"
  cor-titulo: GOLD
  negrito-titulo: true

# Sistema de Partidas (45 min), Invencibilidade (2 min) e Coliseu nas Alturas
partida:
  ativa: false
  duracao-minutos: 45
  invencibilidade-segundos: 120
  bonus-primeiro-porcentagem: 50
  borda-mapa-blocos: 350

coliseu:
  altura-y: 165
  raio: 16

safezone:
  ativada: true
  raio-blocos: 25

tag-padrao: membro

tags:
  dono:
    prefixo: "DONO "
    cor: RED
    negrito: true
    ordem: "01"
  dev:
    prefixo: "DEV "
    cor: AQUA
    negrito: true
    ordem: "02"
  admin:
    prefixo: "ADMIN "
    cor: GOLD
    negrito: true
    ordem: "03"
  mod:
    prefixo: "MOD "
    cor: GREEN
    negrito: true
    ordem: "04"
  vip:
    prefixo: "VIP "
    cor: LIGHT_PURPLE
    negrito: true
    ordem: "05"
  membro:
    prefixo: "MEMBRO "
    cor: GRAY
    negrito: true
    ordem: "99"

# Tag ativa atual de cada jogador
jogadores:
  feeniqs: dono

# Tags liberadas para cada jogador (use '*' para ter todas as tags liberadas)
# Para dar uma tag a um jogador no jogo: /tag add <nick> <tag>
tags-liberadas:
  feeniqs:
    - "*"

# Pontuação e conquistas salvas automaticamente
pontuacao: {}
conquistas-jogador: {}
primeiro-conquista: {}
