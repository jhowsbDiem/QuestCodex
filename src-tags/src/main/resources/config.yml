# ==========================================================
# CONFIGURAÇÃO DE TAGS, SCOREBOARD, COLISEU, KITS E PARTIDA
# ==========================================================

scoreboard:
  ativada: true
  titulo: "QUEST CODEX"
  cor-titulo: GOLD
  negrito-titulo: true

# Sistema de Partidas (45 min), Invencibilidade (2 min), Respawn (30s) e Borda (700 = 350 para cada lado)
partida:
  ativa: false
  duracao-minutos: 45
  invencibilidade-segundos: 120
  respawn-invencibilidade-segundos: 30
  respawn-speed2-segundos: 15
  porcentagem-perda-itens-morte: 30
  porcentagem-dano-durabilidade-morte: 20
  porcentagem-roubo-pontos-pvp: 15
  bonus-primeiro-porcentagem: 50
  borda-mapa-blocos: 700

coliseu:
  altura-y: 165
  raio: 16

safezone:
  ativada: true
  raio-blocos: 25

tag-padrao: membro

tags:
  dono:
    prefixo: "DONO "
    cor: RED
    negrito: true
    ordem: "01"
  dev:
    prefixo: "DEV "
    cor: AQUA
    negrito: true
    ordem: "02"
  admin:
    prefixo: "ADMIN "
    cor: GOLD
    negrito: true
    ordem: "03"
  mod:
    prefixo: "MOD "
    cor: GREEN
    negrito: true
    ordem: "04"
  vip:
    prefixo: "VIP "
    cor: LIGHT_PURPLE
    negrito: true
    ordem: "05"
  membro:
    prefixo: "MEMBRO "
    cor: GRAY
    negrito: true
    ordem: "99"

# Tag ativa atual de cada jogador
jogadores:
  feeniqs: dono

# Tags liberadas para cada jogador (use '*' para ter todas as tags liberadas)
tags-liberadas:
  feeniqs:
    - "*"

# Pontuação e conquistas salvas automaticamente
pontuacao: {}
conquistas-jogador: {}
primeiro-conquista: {}
