name: TagsPlugin
version: '2.0'
main: me.servidor.tags.TagsPlugin
api-version: '26.3'
description: Sistema QuestCodex - Tags, Scoreboard, Livro de Conquistas e Partidas por Pontos
commands:
  tag:
    description: Gerencia as tags dos jogadores
    usage: /tag [help|add|set|criar|remover|lista|reload]
    aliases: [tags, cargo]
  sb:
    description: Ativa ou desativa a Scoreboard lateral
    usage: /sb
    aliases: [scoreboard]
  codex:
    description: Abre o menu de conquistas do QuestCodex ou entrega o livro
    usage: /codex [livro]
    aliases: [quests, missoes, conquistas]
  partida:
    description: Gerencia a partida de pontos do QuestCodex
    usage: /partida <iniciar|parar|resetar|top|darlivro>
  pontos:
    description: Mostra o ranking de pontos da partida
    usage: /pontos
    aliases: [ranking, top]
